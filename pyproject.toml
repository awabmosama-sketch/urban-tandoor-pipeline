[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "urban-tandoor-pipeline"
version = "0.1.0"
description = "Ingestion, embedding and retrieval pipeline for Urban Tandoor restaurant data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Urban Tandoor" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "motor>=3.6",
    "pymongo>=4.8",
    "dnspython>=2.6",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "python-docx>=1.1",
    "openai>=1.40",
    "numpy>=1.26",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "mongomock-motor>=0.0.34",
]

[project.scripts]
utg-ingest = "scripts.ingest_all:cli"
utg-export = "scripts.export_all:cli"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
